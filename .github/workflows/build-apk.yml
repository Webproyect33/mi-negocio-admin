name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir archivos ZIP del proyecto
        run: |
          echo "=== Verificando archivos subidos ==="
          ls -la

          # Descomprimir todos los archivos ZIP encontrados
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "-> Descomprimiendo: $z"
            unzip -o "$z"
          done

          # Si settings.gradle.kts quedó en una subcarpeta
          if [ ! -f "settings.gradle.kts" ]; then
            FOUND_SETTINGS=$(find . -name "settings.gradle.kts" | head -n 1)
            if [ -n "$FOUND_SETTINGS" ]; then
              TARGET_DIR=$(dirname "$FOUND_SETTINGS")
              echo "Moviendo archivos desde $TARGET_DIR a la raíz..."
              cp -rn "$TARGET_DIR"/* . || true
            fi
          fi

          # Crear archivos auxiliares necesarios
          mkdir -p app
          touch app/proguard-rules.pro

          echo "=== Estructura lista para compilación ==="
          ls -la

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar y configurar Gradle 8.4 Oficial
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Compilar APK con Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Localizar APK generado
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/MiNegocioAdmin.apk \;
          echo "=== APK listo para descarga ==="
          ls -lh apk_output/

      - name: Subir APK a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MiNegocioAdmin-APK
          path: apk_output/MiNegocioAdmin.apk
          retention-days: 30
