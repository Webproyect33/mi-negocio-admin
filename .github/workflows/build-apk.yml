name: Compilar APK Android (Sin Gradle)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilar aplicación web
        run: |
          echo "=== 1. Verificando o construyendo aplicación web ==="
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "-> Descomprimiendo: $z"
            unzip -o "$z" || true
          done

          if [ -f "package.json" ]; then
            npm install || true
            npm run build || true
          fi

      - name: Compilar y firmar APK Android (100% Sin Gradle)
        run: |
          set -e
          echo "=== 2. Localizando Android SDK Command-Line Tools ==="
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -n 1)
          echo "Build Tools detectado: $BUILD_TOOLS_DIR"
          echo "Android Platform JAR: $PLATFORM_JAR"

          echo "=== 3. Preparando estructura de compilación ==="
          rm -rf apk_build apk_output
          mkdir -p apk_build/src/com/minegocio/admin
          mkdir -p apk_build/res/values
          mkdir -p apk_build/res/drawable
          mkdir -p apk_build/assets
          mkdir -p apk_build/bin
          mkdir -p apk_build/obj
          mkdir -p apk_output

          # Copiar archivos compilados a los assets de Android
          if [ -d "dist" ]; then
            echo "Copiando dist a assets..."
            cp -r dist/* apk_build/assets/
          elif [ -d "android_project/app/src/main/assets" ]; then
            echo "Copiando assets de android_project..."
            cp -r android_project/app/src/main/assets/* apk_build/assets/
          fi

          if [ ! -f "apk_build/assets/index.html" ]; then
            echo "Generando index.html..."
            cat << 'EOF' > apk_build/assets/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mi Negocio Admin</title>
          </head>
          <body style="background:#082A61;color:white;font-family:sans-serif;text-align:center;padding:40px 20px;">
            <h2>Mi Negocio Admin</h2>
            <p>La aplicación se ha iniciado correctamente.</p>
          </body>
          </html>
          EOF
          fi

          echo "=== 4. Creando recursos y manifiesto nativo ==="
          cat << 'EOF' > apk_build/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Mi Negocio Admin</string>
          </resources>
          EOF

          cat << 'EOF' > apk_build/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.NoTitleBar">
                  <item name="android:windowBackground">#082A61</item>
                  <item name="android:colorBackground">#082A61</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > apk_build/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#082A61" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#10B981" android:pathData="M24,34h60v44h-60z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,48h32v4h-32zM38,58h22v4h-22z" />
          </vector>
          EOF

          cat << 'EOF' > apk_build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.minegocio.admin"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_app_icon"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:supportsRtl="true">
                  <activity
                      android:name="com.minegocio.admin.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "=== 5. Creando Activity Nativa (MainActivity.java) ==="
          cat << 'EOF' > apk_build/src/com/minegocio/admin/MainActivity.java
          package com.minegocio.admin;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.setStatusBarColor(Color.parseColor("#082A61"));
                  }

                  webView = new WebView(this);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setUseWideViewPort(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setBackgroundColor(Color.parseColor("#082A61"));

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

          echo "=== 6. Compilando Recursos con aapt2 ==="
          "$BUILD_TOOLS_DIR/aapt2" compile --dir apk_build/res -o apk_build/res.zip
          "$BUILD_TOOLS_DIR/aapt2" link \
            -I "$PLATFORM_JAR" \
            --manifest apk_build/AndroidManifest.xml \
            -o apk_build/unaligned.apk \
            --auto-add-overlay \
            -A apk_build/assets \
            apk_build/res.zip

          echo "=== 7. Compilando código Java y generando DEX ==="
          javac -cp "$PLATFORM_JAR" -d apk_build/obj apk_build/src/com/minegocio/admin/MainActivity.java
          "$BUILD_TOOLS_DIR/d8" --lib "$PLATFORM_JAR" --output apk_build/bin apk_build/obj/com/minegocio/admin/*.class

          echo "=== 8. Integrando classes.dex al APK ==="
          cd apk_build/bin
          zip -u ../unaligned.apk classes.dex
          cd ../..

          echo "=== 9. Alineando binario con zipalign ==="
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 apk_build/unaligned.apk apk_build/aligned.apk

          echo "=== 10. Firmando APK con apksigner ==="
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out apk_output/MiNegocioAdmin.apk \
            apk_build/aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify apk_output/MiNegocioAdmin.apk

          echo "=== PROCESO COMPLETADO: APK LISTO SIN GRADLE ==="
          ls -lh apk_output/MiNegocioAdmin.apk

      - name: Subir APK a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MiNegocioAdmin-APK
          path: apk_output/MiNegocioAdmin.apk
          retention-days: 30
