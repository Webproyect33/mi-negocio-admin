name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar y verificar estructura del proyecto
        run: |
          echo "=== 1. Inspeccionando archivos en el repositorio ==="
          ls -la

          # Descomprimir todos los archivos ZIP que el usuario haya subido
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "-> Descomprimiendo archivo ZIP: $z"
            unzip -o "$z"
          done

          # Si los archivos quedaron dentro de una subcarpeta (ej: android_project)
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            FOUND_SETTINGS=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND_SETTINGS" ]; then
              TARGET_DIR=$(dirname "$FOUND_SETTINGS")
              echo "Moviendo archivos desde $TARGET_DIR a la raíz..."
              cp -rn "$TARGET_DIR"/* . || true
            fi
          fi

          # Garantizar que gradle.properties existe con AndroidX habilitado
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          ksp.incremental=true
          EOF

          # Garantizar carpetas y archivos auxiliares de Android
          mkdir -p app/schemas
          mkdir -p app/src/main/res/drawable
          touch app/proguard-rules.pro

          # Garantizar que existe el icono de la aplicación
          if [ ! -f "app/src/main/res/drawable/ic_app_icon.xml" ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#082A61" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#10B981" android:pathData="M24,34h60v44h-60z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,48h32v4h-32zM38,58h22v4h-22z" />
          </vector>
          EOF
          fi

          echo "=== 2. Estructura verificada con éxito ==="
          ls -la
          ls -la app || true

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar y configurar Gradle 8.4 Oficial
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Aceptar licencias del SDK de Android
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Compilar APK con Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Localizar APK generado
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/MiNegocioAdmin.apk \;
          echo "=== APK listo para descarga ==="
          ls -lh apk_output/

      - name: Subir APK a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MiNegocioAdmin-APK
          path: apk_output/MiNegocioAdmin.apk
          retention-days: 30
